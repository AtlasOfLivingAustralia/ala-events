apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-es-api
  labels:
    app: events-es-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-es-api
  template:
    metadata:
      labels:
        app: events-es-api
    spec:
      containers:
      - name: events-es-api
        image: atlasoflivingaustralia/es-api:6508a7b5
        ports:
        - containerPort: 4001
        volumeMounts:
        - name: events-config
          mountPath: /usr/src/.env
          subPath: es-api.env
      volumes:
        - name: events-config
          configMap:
            name: events-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-es2vt
  labels:
    app: events-es2vt
spec:
  replicas: 2
