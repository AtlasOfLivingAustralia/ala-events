apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ala-events.fullname" . }}-es-api
  labels:
    {{- include "ala-events.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ala-events.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es-api
  template:
    metadata:
      labels:
        {{- include "ala-events.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es-api
    spec:
      containers:
        - name: {{ .Chart.Name }}-es-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4001
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: events-config
              mountPath: /usr/src/.env
              subPath: es2vt.env
      volumes:
        - name: events-config
          configMap:
            name: events-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ala-events.fullname" . }}-es2vt
  labels:
    {{- include "ala-events.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es2vt
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ala-events.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es2vt
  template:
    metadata:
      labels:
        {{- include "ala-events.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-es2vt
    spec:
      containers:
      - name: {{ .Chart.Name }}--es2vt
        image: atlasoflivingaustralia/es2vt:be674a85
        ports:
        - containerPort: 4002
        volumeMounts:
        - name: events-config
          mountPath: /usr/src/.env
          subPath: es2vt.env
      volumes:
        - name: events-config
          configMap:
            name: events-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ala-events.fullname" . }}-graphql-api
  labels:
    {{- include "ala-events.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-graphql-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ala-events.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-graphql-api
  template:
    metadata:
      labels:
        {{- include "ala-events.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "ala-events.fullname" . }}-graphql-api
    spec:
      containers:
      - name: {{ .Chart.Name }}--graphql-api
        image: atlasoflivingaustralia/graphql-api:6508a7b5
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: events-config
          mountPath: /usr/src/.env
          subPath: graphql-api.env
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
        # readinessProbe:
        #   httpGet:
        #     path: /ready
        #     port: 4000
        #   initialDelaySeconds: 5
        #   periodSeconds: 10
      volumes:
        - name: events-config
          configMap:
            name: events-config