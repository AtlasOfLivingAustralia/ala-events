[DEFAULT]
PRODUCT_COMPONENT = backend
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
HELM_RELEASE_NAME = ala-events-${ENVIRONMENT}
EKS_NAMESPACE = apps

AUTO_DEPLOY = true
SLACK_DEPLOY_NOTIFICATION = true
SLACK_ALERT_CHANNEL = zabbix-alerts

DOCKER_USERNAME = systems@ala.org.au

API_DOWNLOAD = https://api.ala.org.au/dataset/{datasetKey}
DATASET_EML = https://collections.ala.org.au/ws/eml/{datasetKey}
BIE_URL = https://bie-ws.ala.org.au/ws
BIOCACHE_URL = https://biocache-ws.ala.org.au
IMAGES_URL = https://images.ala.org.au
NAMEMATCHING_URL = https://namematching-ws.ala.org.au/
ELASTIC_HOST = elasticsearch-${ENVIRONMENT}
ELASTIC_PORT = 9200

[development]
# code pipeline
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}

HELM_RELEASE_NAME = ala-events-${CLEAN_BRANCH}

API_DOWNLOAD = https://api.test.ala.org.au/dataset/{datasetKey}
DATASET_EML = https://collections-test.ala.org.au/ws/eml/{datasetKey}
BIOCACHE_URL = https://biocache-ws-test.ala.org.au
BIE_URL = https://bie-ws-test.ala.org.au/ws
IMAGES_URL = https://images.test.ala.org.au
NAMEMATCHING_URL = https://namematching-ws-test.ala.org.au/
ELASTIC_HOST = elasticsearch-${CLEAN_BRANCH}

[testing]

API_DOWNLOAD = https://api.test.ala.org.au/dataset/{datasetKey}
DATASET_EML = https://collections-test.ala.org.au/ws/eml/{datasetKey}
BIOCACHE_URL = https://biocache-ws-test.ala.org.au
BIE_URL = https://bie-ws-test.ala.org.au/ws
