version: 0.2
###
# This build project sets up the eks context and deploys the events sub service
# using Helm

env:
  shell: bash
  variables:
    JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2
  secrets-manager:
    ESAPI_APIKEY: $EVENTS_SECRET_NAME:esApi_apiKey

phases:

  install:
    commands:
      - echo Installing dependencies...
      - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
      - chmod 700 get_helm.sh
      - ./get_helm.sh

  build:
    commands:
      - echo Build started on $(date)
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME
      - |
      - if [ "$ELASTICSEARCH_AUTH_ENABLED" = "true" ]; then
      - export ELASTICSEARCH_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$ELASTICSEARCH_SECRET_NAME" --query 'SecretString' --output text | jq -r '.["password"]')
      - fi
      - cd helm
      - | 
        echo "
        esApi:
          apiKey: \"$ESAPI_APIKEY\"
        bie:
          url: $BIE_URL
        biocache:
          url: $BIOCACHE_URL
        images:
          url: $IMAGES_URL
        namematching:
          url: $NAMEMATCHING_URL
        api:
          download: $API_DOWNLOAD
        dataset:
          eml: $DATASET_EML
        elasticsearch:
          indexName: $ES_INDEX
          username: $ELASTICSEARCH_USERNAME
          password: $ELASTICSEARCH_PASSWORD
          hosts: https://${ELASTICSEARCH_ENDPOINT}:${ELASTIC_PORT}
          pv:
            name: pv-$ELASTIC_HOST
            volumeHandle: fs-008ef19f15acc2af8
          pvc:
            name: pvc-$ELASTIC_HOST" > helm_values.yaml
      - echo helm values
      - cat helm_values.yaml
      - echo helm upgrade --install $HELM_RELEASE_NAME . \
        -n $EKS_NAMESPACE \
        --set esApi.image.repository=$ECR_REPO \
        --set esApi.image.tag=$BUILD_TAG_ES_API \
        --set esApi.ingress.hostname=es-$WS_SUB_DOMAIN.$HOSTED_ZONE \
        --set es2vt.image.repository=$ECR_REPO \
        --set es2vt.image.tag=$BUILD_TAG_ES2VT \
        --set es2vt.ingress.hostname=es2vt-$WS_SUB_DOMAIN.$HOSTED_ZONE \
        --set graphqlApi.image.repository=$ECR_REPO \
        --set graphqlApi.image.tag=$BUILD_TAG_GRAPHQL_API \
        --set graphqlApi.ingress.hostname=graphql-$WS_SUB_DOMAIN.$HOSTED_ZONE \                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             .$HOSTED_ZONE \
        --set ingress.certificateArn=$APP_CERTIFICATE \
        -f helm_values.yaml \
        --set-string deploymentChecksum="$(md5sum helm_values.yaml | awk '{print $1}')" \
        --set-string commitHash="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - |
        helm upgrade --install $HELM_RELEASE_NAME . \
          -n $EKS_NAMESPACE \
          --set esApi.image.repository=$ECR_REPO \
          --set esApi.image.tag=$BUILD_TAG_ES_API \
          --set esApi.ingress.hostname=es-$WS_SUB_DOMAIN.$HOSTED_ZONE \
          --set es2vt.image.repository=$ECR_REPO \
          --set es2vt.image.tag=$BUILD_TAG_ES2VT \
          --set es2vt.ingress.hostname=es2vt-$WS_SUB_DOMAIN.$HOSTED_ZONE \
          --set graphqlApi.image.repository=$ECR_REPO \
          --set graphqlApi.image.tag=$BUILD_TAG_GRAPHQL_API \
          --set graphqlApi.ingress.hostname=graphql-$WS_SUB_DOMAIN.$HOSTED_ZONE \
          --set ingress.certificateArn=$APP_CERTIFICATE \
          -f helm_values.yaml \
          --set-string deploymentChecksum="$(md5sum helm_values.yaml | awk '{print $1}')" \
          --set-string commitHash="$CODEBUILD_RESOLVED_SOURCE_VERSION"
  post_build:
    commands:
      - echo Post-build phase...
      - echo Build completed on $(date)
